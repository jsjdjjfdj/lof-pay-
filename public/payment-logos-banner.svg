<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="100%" fill="none">
  <!-- Background -->
  <rect width="1000" height="200" rx="16" fill="#ffffff"/>

  <!-- ================= SECTION 1: bKash ================= -->
  <g transform="translate(40, 30)">
    <!-- bKash Text -->
    <text x="0" y="96" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="70" font-weight="900" fill="#e2136e" letter-spacing="-2">bKash</text>

    <!-- bKash Origami Bird Mark -->
    <g transform="translate(225, 10)">
      <!-- Main body and faceted wings -->
      <polygon points="55,0 95,50 35,65" fill="#d11265" />
      <polygon points="95,50 145,5 98,35" fill="#e2136e" />
      <polygon points="95,50 135,70 120,40" fill="#f43f5e" />
      <polygon points="35,65 5,75 40,90" fill="#e2136e" />
      <polygon points="35,65 95,50 70,115" fill="#be123c" />
      <polygon points="70,115 105,80 95,50" fill="#e2136e" />
      <polygon points="70,115 45,125 40,90" fill="#9f1239" />
    </g>
  </g>

  <!-- Divider 1 -->
  <line x1="395" y1="25" x2="395" y2="175" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ================= SECTION 2: Nagad ================= -->
  <g transform="translate(425, 30)">
    <!-- Swirl Circle Logo -->
    <g transform="translate(15, 10)">
      <!-- Outer circular swirl ring in fiery gradient -->
      <defs>
        <linearGradient id="nagadGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff9800"/>
          <stop offset="40%" stop-color="#f57c00"/>
          <stop offset="100%" stop-color="#d32f2f"/>
        </linearGradient>
      </defs>
      <circle cx="55" cy="55" r="50" fill="url(#nagadGrad)"/>
      <circle cx="55" cy="55" r="34" fill="#ffffff"/>
      <!-- Inner flame runner element -->
      <path d="M55 25 C40 25 32 38 32 52 C32 68 45 78 58 78 C72 78 78 68 78 54 C78 40 68 32 55 25 Z" fill="url(#nagadGrad)" opacity="0.95"/>
      <circle cx="55" cy="46" r="6" fill="#ffffff"/>
      <!-- Runner arms/legs stylized dynamic lines -->
      <path d="M48 56 Q55 52 62 58 Q56 66 48 56" fill="#ffffff"/>
      <path d="M53 62 L48 72 M58 62 L64 72" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Nagad Bengali Text -->
    <text x="145" y="98" font-family="'Hind Siliguri', 'Kalpurush', 'SolaimanLipi', 'Segoe UI', Arial, sans-serif" font-size="78" font-weight="900" fill="#ed1c24" letter-spacing="1">নগদ</text>
  </g>

  <!-- Divider 2 -->
  <line x1="720" y1="25" x2="720" y2="175" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- ================= SECTION 3: Rocket ================= -->
  <g transform="translate(745, 20)">
    <!-- Top English "ROCKET" -->
    <text x="5" y="42" font-family="'Inter', 'Segoe UI', Arial, sans-serif" font-size="28" font-weight="900" fill="#782386" letter-spacing="1.5">ROCKET</text>

    <!-- Origami Paper Rocket / Plane Icon -->
    <g transform="translate(135, 2)">
      <polygon points="50,0 10,48 55,38" fill="#782386"/>
      <polygon points="50,0 85,22 55,38" fill="#9333ea"/>
      <polygon points="10,48 5,35 30,32" fill="#581c87"/>
      <polygon points="55,38 78,42 85,22" fill="#a855f7"/>
      <polygon points="50,0 20,42 45,35" fill="#6b21a8"/>
    </g>

    <!-- Main Bengali "রকেট" -->
    <text x="0" y="115" font-family="'Hind Siliguri', 'Kalpurush', 'SolaimanLipi', 'Segoe UI', Arial, sans-serif" font-size="74" font-weight="900" fill="#782386" letter-spacing="-1">রকেট</text>
    <!-- Dot under র -->
    <circle cx="28" cy="130" r="7" fill="#782386"/>

    <!-- Subtitle: ডাচ-বাংলা ব্যাংক মোবাইল ব্যাংকিং -->
    <text x="45" y="132" font-family="'Hind Siliguri', 'Kalpurush', 'SolaimanLipi', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#782386">ডাচ-বাংলা ব্যাংক মোবাইল ব্যাংকিং</text>
  </g>
</svg>
